<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fedora Loves … Sticker Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #152139;
  color: #eff0f1;
  font-family: 'Open Sans', ui-sans-serif, system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 28px;
  padding: 20px;
}
h1 {
  font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif;
  font-size: 2.4rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: #51a2da;
}
h1 strong { font-weight: 700; color: #eff0f1; }
.machine {
  display: flex;
  align-items: center;
  background: #1d252e;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  border: 1px solid #294172;
}
.sticker-window {
  background: #294172;
  border-radius: 14px;
  padding: 16px;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
  cursor: pointer;
}
#sticker { width: min(560px, 80vw); height: auto; display: block; }
.lever-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 10px 0 16px;
}
.lever-track {
  width: 8px; height: 130px;
  background: linear-gradient(90deg, #3c6eb4, #51a2da, #3c6eb4);
  border-radius: 4px; position: relative;
}
.lever-knob {
  width: 42px; height: 42px;
  background: radial-gradient(circle at 35% 35%, #ed97bb, #db3279);
  border-radius: 50%; position: absolute; left: 50%; top: 0;
  transform: translateX(-50%); cursor: pointer;
  box-shadow: 0 4px 15px rgba(219,50,121,0.3), inset 0 -2px 4px rgba(0,0,0,0.2);
  transition: top 0.15s ease-in; user-select: none; -webkit-user-select: none;
}
.lever-knob:hover { background: radial-gradient(circle at 35% 35%, #f9dde9, #ed97bb); }
.lever-base { width: 28px; height: 10px; background: #3c6eb4; border-radius: 0 0 6px 6px; margin-top: 2px; }
.result {
  font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif;
  font-size: 1.6rem; font-weight: 600; text-align: center;
  display: flex; align-items: center; gap: 10px; min-height: 44px;
}
.result .heart { color: #db3279; display: inline-block; }
.result .logo-name { transition: opacity 0.2s; color: #51a2da; text-decoration: none; }
.result .logo-name:hover { text-decoration: underline; }
.result.spinning .logo-name { opacity: 0.3; }
@keyframes heartPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
.hint { font-size: 0.85rem; color: #6f81a6; margin-top: -12px; }
.outline { transition: opacity 0.5s ease; }
@media (max-width: 640px) {
  h1 { font-size: 1.5rem; }
  .machine { padding: 14px; border-radius: 16px; }
  .sticker-window { padding: 10px; }
  .result { font-size: 1.2rem; }
}
</style>
</head>

var reel = document.getElementById('reel');
var lever = document.getElementById('lever');
var resultEl = document.getElementById('result');
var nameEl = resultEl.querySelector('.logo-name');
var heartEl = resultEl.querySelector('.heart');
var currentIndex = 0;
var currentOutline = 'python';
var isSpinning = false;

function switchOutline(targetOutline) {
  if (targetOutline === currentOutline) return;
  var outNew = document.getElementById('outline-' + targetOutline);
  var outOld = document.getElementById('outline-' + currentOutline);
  var clipGroup = document.getElementById('clip-group');
  outNew.style.opacity = '1';
  setTimeout(function() {
    clipGroup.setAttribute('clip-path', 'url(#clip-' + targetOutline + ')');
    outOld.style.opacity = '0';
  }, 250);
  currentOutline = targetOutline;
}

function buildReel() {
  var html = '';
  for (var i = 0; i < LOGOS.length * REPS; i++) {
    var logo = LOGOS[i % LOGOS.length];
    html += '<g transform="translate(0,' + (i * SLOT_HEIGHT) + ')">' + logo.svg + '</g>';
  }
  reel.innerHTML = html;
}

function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

function spin() {
  if (isSpinning) return;
  isSpinning = true;
  resultEl.classList.add('spinning');
  switchOutline('rust');

  var targetIndex;
  do { targetIndex = Math.floor(Math.random() * LOGOS.length); }
  while (targetIndex === currentIndex && LOGOS.length > 1);

  var delta = ((targetIndex - currentIndex) % LOGOS.length + LOGOS.length) % LOGOS.length || LOGOS.length;
  var totalSlots = EXTRA_ROTATIONS * LOGOS.length + delta;
  var startY = -currentIndex * SLOT_HEIGHT;
  var endY = startY - totalSlots * SLOT_HEIGHT;
  var startTime = performance.now();

  function animate(now) {
    var elapsed = now - startTime;
    var t = Math.min(elapsed / SPIN_DURATION, 1);
    var y = startY + (endY - startY) * easeOutQuart(t);
    reel.setAttribute('transform', 'translate(0,' + y + ')');
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      currentIndex = targetIndex;
      reel.setAttribute('transform', 'translate(0,' + (-currentIndex * SLOT_HEIGHT) + ')');
      isSpinning = false;
      resultEl.classList.remove('spinning');
      nameEl.textContent = LOGOS[currentIndex].name;
      nameEl.href = LOGOS[currentIndex].url;
      heartEl.style.animation = 'none';
      heartEl.offsetHeight;
      heartEl.style.animation = 'heartPop 0.5s ease-in-out';
      switchOutline(LOGOS[currentIndex].outline);
    }
  }
  requestAnimationFrame(animate);
}

function pullLever() {
  if (isSpinning) return;
  lever.style.transition = 'top 0.12s ease-in';
  lever.style.top = '84px';
  setTimeout(function() {
    spin();
    setTimeout(function() {
      lever.style.transition = 'top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
      lever.style.top = '0px';
    }, 180);
  }, 120);
}

lever.addEventListener('click', pullLever);
document.getElementById('sticker-window').addEventListener('click', function(e) {
  if (e.target === lever || lever.contains(e.target)) return;
  pullLever();
});
buildReel();
</script>
